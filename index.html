<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IDD 3.58 Rådgivning & Træning</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#131f24">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #131f24;
            --card-dark: #1f2f38;
            --border-dark: #2c424f;
            --text-main: #ffffff;
            --text-muted: #afbfc7;
            --success: #58cc02;
            --success-dark: #46a302;
            --danger: #ff4b4b;
            --danger-dark: #ea2b2b;
            --primary: #1cb0f6;
            --primary-dark: #1899d6;
        }

        html, body {
            height: 100%; margin: 0; padding: 0;
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; box-sizing: border-box;
        }

        *, *:before, *:after { box-sizing: inherit; }

        .app-container {
            display: flex; flex-direction: column; height: 100vh;
            max-width: 600px; margin: 0 auto; padding: 10px;
        }

        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px; flex-shrink: 0;
        }
        
        .back-btn {
            background: #233642; border: 2px solid var(--border-dark);
            border-bottom-width: 4px; color: var(--text-main);
            padding: 6px 12px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 12px;
        }
        .back-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .card { 
            background: var(--card-dark); border-radius: 20px; padding: 14px; 
            border: 2px solid var(--border-dark); border-bottom-width: 6px; 
            display: flex; flex-direction: column; flex: 1;
            overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 6px;
        }

        .tag { 
            display: inline-block; background: #253b47; color: var(--primary); 
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            padding: 3px 8px; border-radius: 20px; margin-bottom: 6px; align-self: flex-start;
        }

        .filter-box { 
            margin-bottom: 8px; background: var(--card-dark); padding: 8px; 
            border-radius: 14px; border: 2px solid var(--border-dark); flex-shrink: 0;
        }

        select, input[type="text"] { 
            padding: 8px; font-size: 13px; border-radius: 10px; 
            border: 2px solid var(--border-dark); width: 100%; margin-top: 4px; 
            background: #111a21; color: var(--text-main); outline: none; font-weight: 700;
        }

        /* Fastlåst svarkontainer så knapperne aldrig forsvinder */
        .options-container {
            display: flex; flex-direction: column; gap: 6px; margin-top: 6px;
            flex-shrink: 0;
        }

        .btn { 
            display: block; width: 100%; text-align: left; padding: 10px 12px; 
            border: 2px solid var(--border-dark); border-bottom-width: 4px; border-radius: 12px; 
            background: #233642; cursor: pointer; font-size: 13px; font-weight: 700;
            color: var(--text-main); transition: all 0.1s;
        }
        .btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }

        .correct { background-color: #1b4d2e !important; border-color: var(--success) !important; color: #d1fae5 !important; }
        .wrong { background-color: #4d1b1b !important; border-color: var(--danger) !important; color: #fee2e2 !important; }

        .explanation { 
            margin-top: 6px; padding: 8px; background: #11261d; border: 2px solid #1e4630;
            border-radius: 10px; font-size: 11px; display: none; color: #a7f3d0;
            max-height: 70px; overflow-y: auto; flex-shrink: 0;
        }

        .next-btn { 
            background: var(--success); border-bottom: 4px solid var(--success-dark);
            color: white; border-radius: 12px; cursor: pointer; padding: 10px; 
            display: none; font-weight: 800; font-size: 14px; width: 100%; 
            text-align: center; margin-top: 6px; flex-shrink: 0;
        }
        .next-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .score { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        .progress-bar-container { width: 100%; background: #2b414d; height: 6px; border-radius: 3px; margin-bottom: 8px; overflow: hidden; flex-shrink: 0; }
        .progress-bar-fill { height: 100%; background: var(--success); width: 0%; border-radius: 3px; transition: width 0.3s ease; }

        .restart-btn { background: var(--primary); border-bottom: 4px solid var(--primary-dark); color: white; border-radius: 12px; cursor: pointer; padding: 10px; width: 100%; margin-top: 6px; font-weight: 800; font-size: 13px; }

        .menu-grid { display: flex; flex-direction: column; gap: 8px; justify-content: center; flex: 1; overflow-y: auto; padding-right: 2px; }
        .menu-btn { background: var(--card-dark); border: 2px solid var(--border-dark); border-bottom-width: 5px; color: var(--text-main); padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; transition: all 0.1s; flex-shrink: 0; }
        .menu-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .menu-btn span { font-size: 20px; }

        /* Rollespil / Chat layout specifikt fix */
        .chat-container { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            padding-right: 2px; 
            margin-bottom: 6px;
            max-height: calc(100vh - 220px);
        }
        .bubble { padding: 10px 12px; border-radius: 14px; font-size: 12px; line-height: 1.3; max-width: 90%; word-wrap: break-word; }
        .bubble-sensor { background: #233642; border: 1px solid var(--border-dark); align-self: flex-start; border-bottom-left-radius: 4px; color: #fff; }
        .bubble-user { background: var(--primary-dark); align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
        .dialog-feedback { font-size: 11px; color: var(--success); font-weight: 700; text-align: center; margin-bottom: 4px; flex-shrink: 0; }
        
        .wiki-item { background: #111a21; border: 1px solid var(--border-dark); padding: 10px; border-radius: 10px; margin-bottom: 6px; }
        .wiki-title { font-weight: 800; color: var(--primary); font-size: 13px; margin-bottom: 2px; display: flex; justify-content: space-between;}
        .wiki-desc { font-size: 11px; color: var(--text-muted); line-height: 1.3; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- FORSIDE / MENU -->
        <div id="home-section" style="display: flex; flex-direction: column; height: 100%;">
            <div class="card" style="justify-content: space-between; text-align: center; padding: 16px;">
                <div style="margin-bottom: 10px;">
                    <span style="font-size: 28px;">🛡️</span>
                    <h2 style="margin: 4px 0; font-size: 18px;">IDD 3.58 - Rådgivning</h2>
                    <p style="color: var(--text-muted); font-size: 11px; margin: 0;">Officielt pensum og mængdetræning</p>
                </div>

                <div class="menu-grid">
                    <button class="menu-btn" onclick="skiftFane('quiz')" style="border-color: #58cc02; background: #1b4d2e;">
                        <span>🎯</span> <div><div>Pensum Træning</div><div style="font-size: 10px; color: #a7f3d0; font-weight: normal;">Massevis af opgaver i alle emner</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('dialog')" style="border-color: #ff4b4b; background: #4d1b1b;">
                        <span>🗣️</span> <div><div>Rollespil (Kundeflows)</div><div style="font-size: 10px; color: #fecaca; font-weight: normal;">Dynamiske samtaler med fast låst layout</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('wiki')" style="border-color: #ff9600; background: #452b11;">
                        <span>📖</span> <div><div>Opslagsværk</div><div style="font-size: 10px; color: #fde68a; font-weight: normal;">Søg i AFTL, FAL og begreber</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('exam')" style="border-color: #1cb0f6; background: #153342;">
                        <span>⏱️</span> <div><div>Eksamenstest</div><div style="font-size: 10px; color: #bae6fd; font-weight: normal;">40 spørgsmål - 60 minutter</div></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- SPIL CONTAINER -->
        <div id="game-container" style="display: none; flex-direction: column; height: 100%;">
            <div class="top-bar">
                <button class="back-btn" onclick="gaaTilForside()">🏠 Menu</button>
                <span id="active-title" style="font-weight: 800; font-size: 12px; color: var(--text-muted);">...</span>
            </div>

            <!-- SEKTION 1: TRÆNING -->
            <div id="quiz-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="filter-box">
                    <label for="category-select" style="font-weight: 800; font-size: 11px; color: var(--text-muted);">VÆLG PENSUM EMNE:</label>
                    <select id="category-select" onchange="filterAndRestart()">
                        <option value="alle">Alle emner (Blandet)</option>
                        <option value="Produkter">Produkter og tilvalgsdækninger</option>
                        <option value="Tegning">Forsikringens tegning (AFTL)</option>
                        <option value="Ændringer">Ændringer i løbetid</option>
                        <option value="Skadesituationen">Skadesituationen (FAL)</option>
                        <option value="Lønsomhed">Lønsomhed og kundeloyalitet</option>
                        <option value="Etik">Etik i salget (God skik)</option>
                        <option value="Samtalestruktur">Samtalestruktur</option>
                    </select>
                </div>

                <div class="card">
                    <div class="score">
                        <span id="score-board">Spørgsmål 1</span>
                        <span id="live-score">Rigtige: 0 / 0</span>
                    </div>
                    <div class="progress-bar-container"><div id="progress-bar-fill" class="progress-bar-fill"></div></div>
                    <span id="category-tag" class="tag">Kategori</span>
                    <h3 id="question-text" style="margin: 0 0 6px 0; font-size: 13px; line-height: 1.3;">Henter spørgsmål...</h3>
                    <div id="options-container" class="options-container"></div>
                    <div id="explanation-box" class="explanation">
                        <strong>💡 Faglig begrundelse:</strong>
                        <p id="explanation-text" style="margin:2px 0 0 0;"></p>
                    </div>
                    <button id="next-btn" class="next-btn" onclick="nextQuestion()">Fortsæt →</button>
                </div>
            </div>

            <!-- SEKTION 4: SAMTALE / ROLLESPIL -->
            <div id="dialog-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="filter-box">
                    <label style="font-weight: 800; font-size: 11px; color: var(--text-muted);">VÆLG ROLLESPIL:</label>
                    <select id="case-select" onchange="startNyCase()">
                        <option value="case3">🔥 Samlet Kundeflow: Ny Helkunde (Rækkehus)</option>
                        <option value="case1">Kunde: Henrik (Aftaleloven - Tilbud)</option>
                        <option value="case2">Kunde: Sanne (FAL - Overforsikring)</option>
                    </select>
                </div>

                <div class="card" style="flex: 1; padding: 10px; display: flex; flex-direction: column; overflow: hidden;">
                    <div id="dialog-history" class="chat-container"></div>
                    <div id="dialog-feedback" class="dialog-feedback"></div>
                    <div id="dialog-options" class="options-container" style="flex-shrink: 0;"></div>
                    <button id="dialog-next-btn" class="next-btn" onclick="naesteDialogSkridt()">Fortsæt Samtalen →</button>
                    <button id="dialog-restart-btn" class="restart-btn" style="display: none;" onclick="startNyCase()">Prøv Igen 🔄</button>
                </div>
            </div>

            <!-- SEKTION 5: OPSLAGSVÆRK -->
            <div id="wiki-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="card">
                    <h3 style="font-size: 15px; margin-top:0;">📖 Opslagsværk</h3>
                    <input type="text" id="wiki-search" placeholder="Søg på FAL, AFTL, Pro-rata..." onkeyup="sogIOpslagsvaerk()">
                    <div class="options-container" id="wiki-results" style="margin-top: 6px; overflow-y: auto; flex:1;"></div>
                </div>
            </div>

            <!-- EKSAMEN STUB -->
            <div id="exam-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="card" style="justify-content: center; text-align: center;">
                    <h3>Eksamenstest</h3><p style="font-size: 12px; color:var(--text-muted);">Simuleret 40-spørgsmåls prøve.</p>
                    <button class="login-btn" onclick="gaaTilForside()">Tilbage til Menu</button>
                </div>
            </div>
        </div>
    </div>

<script>
function skiftFane(fane) {
    document.getElementById("home-section").style.display = "none";
    document.getElementById("game-container").style.display = "flex";
    document.querySelectorAll(".game-view").forEach(v => v.style.display = "none");
    const titler = { 'quiz': '🎯 PENSUM TRÆNING', 'exam': '⏱️ EKSAMEN', 'dialog': '🗣️ ROLLESPIL', 'wiki': '📖 OPSLAG' };
    document.getElementById("active-title").innerText = titler[fane] || '';

    if (fane === 'quiz') { document.getElementById("quiz-section").style.display = "flex"; filterAndRestart(); }
    else if (fane === 'exam') { document.getElementById("exam-section").style.display = "flex"; }
    else if (fane === 'dialog') { document.getElementById("dialog-section").style.display = "flex"; startNyCase(); }
    else if (fane === 'wiki') { document.getElementById("wiki-section").style.display = "flex"; initOpslagsvaerk(); }
}
function gaaTilForside() { document.getElementById("game-container").style.display = "none"; document.getElementById("home-section").style.display = "flex"; }

// ==========================================
// OPSLAGSVÆRK DATA
// ==========================================
const opslagsData = [
    { emne: "Berigelsesforbuddet", kat: "FAL § 39", tekst: "Man må ikke opnå en økonomisk vinding ved en skade. Erstatningen kan aldrig overstige det faktiske tab (Overforsikring)." },
    { emne: "Underforsikring", kat: "FAL § 40", tekst: "Hvis forsikringssummen er lavere end de faktiske værdier, nedsættes erstatningen forholdsmæssigt (pro-rata)." },
    { emne: "Fremrykket accept", kat: "FAL § 11", tekst: "Særlig regel for forsikringer: Selskabets ansvar indtræder, når kunden har accepteret et tilbud, hvis selskabet normalt ville have antaget risikoen." },
    { emne: "Mundtlige tilbud", kat: "AFTL § 3", tekst: "Mundtlige tilbud skal accepteres straks, medmindre en anden frist aftales. Ellers falder de bort." },
    { emne: "Uren Accept", kat: "AFTL § 6", tekst: "Ændrer kunden i vilkår eller pris ved accept, betragtes det som et afslag og et nyt modtilbud." },
    { emne: "Fuldmagt / Legitimation", kat: "AFTL § 10", tekst: "Legitimation er hvad kunden udefra forventer sælgeren må (fx give rabat). Selskabet er bundet over for godtroende kunder." },
    { emne: "God Skik (IDD)", kat: "Etik", tekst: "Pligt til at handle ærligt, redeligt og professionelt i kundens bedste interesse samt foretage objektiv behovsafdækning." },
    { emne: "Culpa-reglen", kat: "Erstatning", tekst: "Grundregel: Man er kun erstatningsansvarlig for skader forvoldt ved uagtsomhed eller forsæt." },
    { emne: "Samtalestruktur", kat: "Salg", tekst: "1. Indledning, 2. Behovsafdækning (HV-spørgsmål), 3. Løsning, 4. Accept/Indvendinger, 5. Afslutning." },
    { emne: "Lønsomhed / Churn", kat: "Økonomi", tekst: "Churn er kundeafgang. Krydssalg af flere produkter til samme kunde øger loyaliteten og forbedrer lønsomheden." }
];
function initOpslagsvaerk() { visOpslagsvaerkResultater(opslagsData); }
function sogIOpslagsvaerk() {
    const term = document.getElementById("wiki-search").value.toLowerCase();
    visOpslagsvaerkResultater(opslagsData.filter(o => o.emne.toLowerCase().includes(term) || o.tekst.toLowerCase().includes(term) || o.kat.toLowerCase().includes(term)));
}
function visOpslagsvaerkResultater(data) {
    const container = document.getElementById("wiki-results");
    container.innerHTML = data.map(item => `<div class="wiki-item"><div class="wiki-title">${item.emne} <span class="tag">${item.kat}</span></div><div class="wiki-desc">${item.tekst}</div></div>`).join("");
}

// ==========================================
// STOR OPGAVEPULJE (MÆNGDETRÆNING)
// ==========================================
const alleOpgaver = [
  { id: "t_1", kategori: "Tegning", spørgsmål: "Kunden 'vil tænke over' et mundtligt tilbud. Senere på dagen ringer kunden og accepterer. Er aftalen bindende?", options: ["Ja, tilbud gælder 24 timer.", "Nej, mundtlige tilbud falder bort, hvis de ikke accepteres straks (AFTL § 3).", "Ja, hvis samtalen optages."], answer: 1, forklaring: "Jf. AFTL § 3 skal mundtlige tilbud accepteres straks." },
  { id: "t_2", kategori: "Tegning", spørgsmål: "Frank ændrer prisen i et skriftligt tilbud, underskriver og returnerer. Hvad er konsekvensen?", options: ["Aftalen gælder med den nye pris.", "Ændringen er en 'uren accept', der betragtes som afslag og nyt modtilbud (AFTL § 6).", "Aftalen bortfalder fuldstændigt uden modtilbud."], answer: 1, forklaring: "AFTL § 6: Uren accept er et afslag + nyt tilbud." },
  { id: "t_3", kategori: "Tegning", spørgsmål: "Kunden køber forsikring online til hurtigst mulig ikrafttræden, men får indbrud før policen udstedes. Dækkes skaden?", options: ["Nej, policen skal foreligge fysisk.", "Ja, pga. fremrykket accept (FAL § 11), da selskabet normalt ville have antaget risikoen.", "Kun hvis første præmie er trukket via betalingskort."], answer: 1, forklaring: "FAL § 11 (fremrykket accept) sikrer dækning fra accept-afsendelse." },
  { id: "t_4", kategori: "Tegning", spørgsmål: "Du giver 10% rabat i strid med interne regler. Er selskabet bundet over for kunden?", options: ["Nej, intern bemyndigelse kan aldrig overskrides.", "Ja, du handlede inden for din legitimation, og kunden var i god tro (AFTL § 10).", "Nej, aftalen kræver chefens underskrift."], answer: 1, forklaring: "Legitimation bindes over for godtroende kunder jf. AFTL § 10." },
  { id: "s_1", kategori: "Skadesituationen", spørgsmål: "Sanne har 1 mio. i indbosum, men reelt kun værdier for 750.000 kr. Hvad gælder ved totalskade?", options: ["Hun får udbetalt 1.000.000 kr.", "Hun får max 750.000 kr. pga. berigelsesforbuddet (FAL § 39).", "Selskabet udbetaler ingenting pga. fejlagtig sum."], answer: 1, forklaring: "FAL § 39: Man må ikke opnå vinding (berigelsesforbud)." },
  { id: "s_2", kategori: "Skadesituationen", spørgsmål: "Peter har stjålet for 100.000 kr. Summen er 800.000 kr., men værdierne er reelt 1 mio. kr. Hvad udbetales?", options: ["100.000 kr. fuldt ud.", "80.000 kr. pga. pro-rata reglen ved underforsikring (FAL § 40).", "800.000 kr."], answer: 1, forklaring: "FAL § 40: Underforsikring medfører proportional erstatning (80%)." },
  { id: "s_3", kategori: "Skadesituationen", spørgsmål: "Hvordan gøres erstatning for bygningsskader på parcelhuse som udgangspunkt op?", options: ["Nyværdi (genopførelsespris for tilsvarende stand).", "Dagsværdi (fratrukket slid og ælde).", "Offentlig ejendomsvurdering."], answer: 0, forklaring: "Parcelhuse dækkes som udgangspunkt til nyværdi ved genopførelse." },
  { id: "a_1", kategori: "Ændringer", spørgsmål: "Hvornår kan en privatforsikring normalt opsiges gebyrfrit af kunden?", options: ["Når som helst med 1 dags varsel.", "Til hovedforfald (med 1 md. varsel) eller ved risikoens ophør (fx hussalg).", "Kun i januar måned."], answer: 1, forklaring: "Opsigelse følger hovedforfald eller ophør af risiko." },
  { id: "a_2", kategori: "Ændringer", spørgsmål: "Kunden udvider huset med en stor ny tagetage uden at melde det til selskabet. Hvad sker der ved en skade?", options: ["Ingenting, alt på adressen er dækket.", "Det er en risikoændring (fareforøgelse), som kan begrænse erstatningen.", "Politiet inddrager policen."], answer: 1, forklaring: "Væsentlige udvidelser er risikoændringer, der skal oplyses." },
  { id: "p_1", kategori: "Produkter", spørgsmål: "Hvad dækker bilens lovpligtige ansvarsforsikring?", options: ["Skader på egen bil ved solouheld.", "Skader kunden forvolder på andres person og ting.", "Hærværk begået af ukendte personer."], answer: 1, forklaring: "Ansvarsforsikringen dækker skader på ANDRE." },
  { id: "p_2", kategori: "Produkter", spørgsmål: "Er en el-cykel (op til 25 km/t) omfattet af indboforsikringens ansvarsdel?", options: ["Ja, som udgangspunkt som almindelig cykel.", "Nej, den kræver selskabets særskilte motorforsikring.", "Kun hvis den kører over 30 km/t."], answer: 0, forklaring: "El-cykler med pedalkraft op til 25 km/t sidestilles med almindelige cykler." },
  { id: "p_3", kategori: "Produkter", spørgsmål: "Dækker en almindelig indbo-ansvarsforsikring skader forårsaget af kundens hund?", options: ["Ja, alle kæledyr er dækket.", "Nej, hunde kræver en særskilt lovpligtig hundeansvarsforsikring.", "Kun hvis hunden er under 1 år gammel."], answer: 1, forklaring: "Hundeloven kræver en særskilt hundeansvarsforsikring." },
  { id: "l_1", kategori: "Lønsomhed", spørgsmål: "Hvorfor er 'helkunder' (flere produkter samlet) fordelagtige for selskabets lønsomhed?", options: ["De betaler dobbelt præmie.", "De har markant lavere churn (opsigelsesfrekvens) og bedre porteføljeøkonomi.", "De ringer aldrig til kundecentret."], answer: 1, forklaring: "Helkunder er mere loyale, hvilket sænker churn og øger lønsomheden." },

let aktiveOpgaver = []; let currentIndex = 0; let correctCount = 0;
function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
function filterAndRestart() {
    const valg = document.getElementById("category-select").value;
    if (valg === "alle") aktiveOpgaver = shuffle([...alleOpgaver]);
    else aktiveOpgaver = shuffle(alleOpgaver.filter(q => q.kategori === valg));
    currentIndex = 0; correctCount = 0; loadQuestion();
}

function loadQuestion() {
    if (!aktiveOpgaver.length) { document.getElementById("options-container").innerHTML = "<p>Ingen spørgsmål.</p>"; return; }
    const q = aktiveOpgaver[currentIndex];
    document.getElementById("category-tag").innerText = q.kategori; 
    document.getElementById("question-text").innerText = q.spørgsmål;
    document.getElementById("explanation-box").style.display = "none"; 
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("progress-bar-fill").style.width = (currentIndex / aktiveOpgaver.length * 100) + "%";

    const container = document.getElementById("options-container"); container.innerHTML = "";
    q.options.forEach((opt, i) => {
        const btn = document.createElement("button"); btn.className = "btn"; btn.innerText = opt;
        btn.onclick = () => {
            if (i === q.answer) correctCount++;
            container.querySelectorAll(".btn").forEach((b, idx) => {
                b.disabled = true; if (idx === q.answer) b.classList.add("correct");
                if (idx === i && i !== q.answer) b.classList.add("wrong");
            });
            document.getElementById("explanation-text").innerText = q.forklaring;
            document.getElementById("explanation-box").style.display = "block"; 
            document.getElementById("next-btn").style.display = "block";
        };
        container.appendChild(btn);
    });
    document.getElementById("score-board").innerText = `Spørgsmål ${currentIndex + 1} af ${aktiveOpgaver.length}`;
    document.getElementById("live-score").innerText = `Rigtige: ${correctCount}`;
}
function nextQuestion() {
    currentIndex++;
    if (currentIndex < aktiveOpgaver.length) loadQuestion();
    else {
        document.getElementById("progress-bar-fill").style.width = "100%";
        document.getElementById("options-container").innerHTML = `<div style="text-align:center;"><h3>Træning afsluttet!</h3><p>Du fik ${correctCount} af ${aktiveOpgaver.length} rigtige.</p><button class="restart-btn" onclick="filterAndRestart()">Prøv Igen 🔄</button></div>`;
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("explanation-box").style.display = "none";
    }
}

let nuvCaseId = "case3"; let nuvStepId = "start";
function startNyCase() {
    nuvCaseId = document.getElementById("case-select").value; nuvStepId = "start";
    document.getElementById("dialog-history").innerHTML = ""; document.getElementById("dialog-options").innerHTML = "";
    document.getElementById("dialog-feedback").innerText = ""; document.getElementById("dialog-next-btn").style.display = "none";
    document.getElementById("dialog-restart-btn").style.display = "none";
    renderDialogStep();
}
function renderDialogStep() {
    const s = cases[nuvCaseId].steps[nuvStepId];
    const hist = document.getElementById("dialog-history");
    hist.innerHTML += `<div class="bubble bubble-sensor">${s.sensor}</div>`;
    hist.scrollTop = hist.scrollHeight;
    
    const optCont = document.getElementById("dialog-options");
    optCont.innerHTML = "";
    if (s.options.length === 0) { document.getElementById("dialog-restart-btn").style.display = "block"; return; }
    s.options.forEach(o => {
        const b = document.createElement("button"); b.className = "btn"; b.innerText = o.text;
        b.onclick = () => {
            hist.innerHTML += `<div class="bubble bubble-user">${o.text}</div>`;
            hist.scrollTop = hist.scrollHeight;
            const fb = document.getElementById("dialog-feedback"); fb.innerText = o.feedback; fb.style.color = o.rigtig ? "var(--success)" : "var(--danger)";
            optCont.innerHTML = ""; nuvStepId = o.next; document.getElementById("dialog-next-btn").style.display = "block";
        };
        optCont.appendChild(b);
    });
}
function naesteDialogSkridt() { document.getElementById("dialog-next-btn").style.display = "none"; renderDialogStep(); }
