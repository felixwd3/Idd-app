<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IDD 3.58 Rådgivning & Træning</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#131f24">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #131f24;
            --card-dark: #1f2f38;
            --border-dark: #2c424f;
            --text-main: #ffffff;
            --text-muted: #afbfc7;
            --success: #58cc02;
            --success-dark: #46a302;
            --danger: #ff4b4b;
            --danger-dark: #ea2b2b;
            --primary: #1cb0f6;
            --primary-dark: #1899d6;
            --duel-color: #ce82ff;
            --duel-dark: #a558d6;
        }

        html, body {
            height: 100%; margin: 0; padding: 0;
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; box-sizing: border-box;
        }

        *, *:before, *:after { box-sizing: inherit; }

        .app-container {
            display: flex; flex-direction: column; height: 100vh;
            max-width: 600px; margin: 0 auto; padding: 12px;
        }

        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; flex-shrink: 0;
        }
        
        .back-btn {
            background: #233642; border: 2px solid var(--border-dark);
            border-bottom-width: 4px; color: var(--text-main);
            padding: 8px 14px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 13px;
        }
        .back-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .card { 
            background: var(--card-dark); border-radius: 20px; padding: 16px; 
            border: 2px solid var(--border-dark); border-bottom-width: 6px; 
            display: flex; flex-direction: column; flex: 1;
            overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 10px;
        }

        .tag { 
            display: inline-block; background: #253b47; color: var(--primary); 
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; align-self: flex-start;
        }

        .filter-box { 
            margin-bottom: 10px; background: var(--card-dark); padding: 10px; 
            border-radius: 16px; border: 2px solid var(--border-dark); flex-shrink: 0;
        }

        select, input[type="text"] { 
            padding: 10px; font-size: 14px; border-radius: 12px; 
            border: 2px solid var(--border-dark); width: 100%; margin-top: 4px; 
            background: #111a21; color: var(--text-main); outline: none; font-weight: 700;
        }

        .options-container {
            display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
            overflow-y: auto; flex: 1; padding-right: 2px;
        }

        .btn { 
            display: block; width: 100%; text-align: left; padding: 12px 14px; 
            border: 2px solid var(--border-dark); border-bottom-width: 4px; border-radius: 14px; 
            background: #233642; cursor: pointer; font-size: 14px; font-weight: 700;
            color: var(--text-main); flex-shrink: 0; transition: all 0.1s;
        }
        .btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }

        .correct { background-color: #1b4d2e !important; border-color: var(--success) !important; border-bottom-width: 4px !important; color: #d1fae5 !important; }
        .wrong { background-color: #4d1b1b !important; border-color: var(--danger) !important; border-bottom-width: 4px !important; color: #fee2e2 !important; }

        .explanation { 
            margin-top: 8px; padding: 10px; background: #11261d; border: 2px solid #1e4630;
            border-radius: 12px; font-size: 12px; display: none; color: #a7f3d0;
            max-height: 90px; overflow-y: auto; flex-shrink: 0;
        }

        .next-btn { 
            background: var(--success); border-bottom: 4px solid var(--success-dark);
            color: white; border-radius: 14px; cursor: pointer; padding: 12px; 
            display: none; font-weight: 800; font-size: 15px; width: 100%; 
            text-align: center; margin-top: 8px; flex-shrink: 0;
        }
        .next-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .score { font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        .progress-bar-container { width: 100%; background: #2b414d; height: 8px; border-radius: 4px; margin-bottom: 10px; overflow: hidden; flex-shrink: 0; }
        .progress-bar-fill { height: 100%; background: var(--success); width: 0%; border-radius: 4px; transition: width 0.3s ease; }

        .restart-btn { background: var(--primary); border-bottom: 4px solid var(--primary-dark); color: white; border-radius: 14px; cursor: pointer; font-weight: 800; font-size: 14px; padding: 12px; width: 100%; margin-top: 8px; }

        .menu-grid { display: flex; flex-direction: column; gap: 10px; justify-content: center; flex: 1; overflow-y: auto; padding-right: 4px; }
        .menu-btn { background: var(--card-dark); border: 2px solid var(--border-dark); border-bottom-width: 5px; color: var(--text-main); padding: 14px; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; transition: all 0.1s; flex-shrink: 0; }
        .menu-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .menu-btn span { font-size: 22px; }

        .duel-box { border: 2px dashed var(--border-dark); padding: 12px; border-radius: 14px; margin-bottom: 8px; text-align: center; background: #17242c; }
        .login-btn { background: var(--primary); border-bottom: 4px solid var(--primary-dark); color: white; border-radius: 12px; cursor: pointer; padding: 10px; width: 100%; font-weight: 800; font-size: 14px; margin-top: 6px; border:none; }
        .login-btn:active { transform: translateY(2px); border-bottom-width: 0; margin-bottom: 4px;}
        
        .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; margin-bottom: 10px; }
        .bubble { padding: 12px 14px; border-radius: 16px; font-size: 13px; line-height: 1.4; max-width: 85%; word-wrap: break-word; }
        .bubble-sensor { background: #233642; border: 1px solid var(--border-dark); align-self: flex-start; border-bottom-left-radius: 4px; color: #fff; }
        .bubble-user { background: var(--primary-dark); align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
        .dialog-feedback { font-size: 12px; color: var(--success); font-weight: 700; text-align: center; margin-bottom: 5px; }
        
        .wiki-item { background: #111a21; border: 1px solid var(--border-dark); padding: 12px; border-radius: 12px; margin-bottom: 8px; }
        .wiki-title { font-weight: 800; color: var(--primary); font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between;}
        .wiki-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- FORSIDE / MENU -->
        <div id="home-section" style="display: flex; flex-direction: column; height: 100%;">
            <div class="card" style="justify-content: space-between; text-align: center; padding: 20px;">
                <div style="margin-bottom: 15px;">
                    <span style="font-size: 32px;">🛡️</span>
                    <h2 style="margin: 5px 0; font-size: 20px;">IDD 3.58 - Rådgivning</h2>
                    <p style="color: var(--text-muted); font-size: 12px; margin: 0;">Officielt pensum og træning</p>
                </div>

                <div class="menu-grid">
                    <button class="menu-btn" onclick="skiftFane('quiz')" style="border-color: #58cc02; background: #1b4d2e;">
                        <span>🎯</span> <div><div>Pensum Træning</div><div style="font-size: 11px; color: #a7f3d0; font-weight: normal;">Træn alle kategorier (Lønsomhed, Etik m.m.)</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('dialog')" style="border-color: #ff4b4b; background: #4d1b1b;">
                        <span>🗣️</span> <div><div>Rollespil (Kundeflows)</div><div style="font-size: 11px; color: #fecaca; font-weight: normal;">Træn dynamiske kundesamtaler</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('wiki')" style="border-color: #ff9600; background: #452b11;">
                        <span>📖</span> <div><div>Opslagsværk</div><div style="font-size: 11px; color: #fde68a; font-weight: normal;">Søg i AFTL, FAL og dækninger</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('exam')" style="border-color: #1cb0f6; background: #153342;">
                        <span>⏱️</span> <div><div>Eksamenstest</div><div style="font-size: 11px; color: #bae6fd; font-weight: normal;">40 spørgsmål - 60 minutter</div></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- SPIL CONTAINER -->
        <div id="game-container" style="display: none; flex-direction: column; height: 100%;">
            <div class="top-bar">
                <button class="back-btn" onclick="gaaTilForside()">🏠 Menu</button>
                <span id="active-title" style="font-weight: 800; font-size: 13px; color: var(--text-muted);">...</span>
            </div>

            <!-- SEKTION 1: TRÆNING -->
            <div id="quiz-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="filter-box">
                    <label for="category-select" style="font-weight: 800; font-size: 12px; color: var(--text-muted);">VÆLG PENSUM EMNE:</label>
                    <select id="category-select" onchange="filterAndRestart()">
                        <option value="alle">Alle emner (Blandet)</option>
                        <option value="fejl" id="fejl-option">❌ Mine fejl (0)</option>
                        <option value="Produkter">Produkter og tilvalgsdækninger</option>
                        <option value="Tegning">Forsikringens tegning</option>
                        <option value="Ændringer">Ændringer i løbetid</option>
                        <option value="Skadesituationen">Skadesituationen</option>
                        <option value="Lønsomhed">Lønsomhed og kundeloyalitet</option>
                        <option value="Etik">Etik i salget</option>
                        <option value="Samtalestruktur">Samtalestruktur</option>
                    </select>
                </div>

                <div class="card">
                    <div class="score">
                        <span id="score-board">Spørgsmål 1</span>
                        <span id="live-score">Rigtige: 0 / 0</span>
                    </div>
                    <div class="progress-bar-container"><div id="progress-bar-fill" class="progress-bar-fill"></div></div>
                    <span id="category-tag" class="tag">Kategori</span>
                    <h3 id="question-text" style="margin: 0 0 8px 0; font-size: 14px; line-height: 1.3;">Henter spørgsmål...</h3>
                    <div id="options-container" class="options-container"></div>
                    <div id="explanation-box" class="explanation">
                        <strong>💡 Faglig begrundelse:</strong>
                        <p id="explanation-text" style="margin:2px 0 0 0;"></p>
                    </div>
                    <button id="next-btn" class="next-btn" onclick="nextQuestion()">Fortsæt →</button>
                </div>
            </div>

            <!-- SEKTION 4: SAMTALE / ROLLESPIL -->
            <div id="dialog-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="filter-box">
                    <label style="font-weight: 800; font-size: 12px; color: var(--text-muted);">VÆLG ROLLESPIL:</label>
                    <select id="case-select" onchange="startNyCase()">
                        <option value="case3">🔥 Samlet Kundeflow: Ny Helkunde</option>
                        <option value="case1">Kunde: Henrik (Aftaleloven - Tilbud)</option>
                        <option value="case2">Kunde: Sanne (FAL - Overforsikring)</option>
                    </select>
                </div>

                <div class="card" style="flex: 1; padding: 10px; display: flex; flex-direction: column;">
                    <div id="dialog-history" class="chat-container"></div>
                    <div id="dialog-feedback" class="dialog-feedback"></div>
                    <div id="dialog-options" class="options-container" style="flex: none; margin-top:0;"></div>
                    <button id="dialog-next-btn" class="next-btn" style="display: none;" onclick="naesteDialogSkridt()">Fortsæt Samtalen →</button>
                    <button id="dialog-restart-btn" class="restart-btn" style="display: none;" onclick="startNyCase()">Prøv Igen 🔄</button>
                </div>
            </div>

            <!-- SEKTION 5: OPSLAGSVÆRK -->
            <div id="wiki-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="card">
                    <h3 style="font-size: 16px; margin-top:0;">📖 Opslagsværk</h3>
                    <input type="text" id="wiki-search" placeholder="Søg på FAL, AFTL, Pro-rata..." onkeyup="sogIOpslagsvaerk()">
                    <div class="options-container" id="wiki-results" style="margin-top: 8px;"></div>
                </div>
            </div>

            <!-- SEKTION EKSAMEN STUB -->
            <div id="exam-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="card" style="justify-content: center; text-align: center;">
                    <h3>Eksamen</h3><p>Starter simuleret test...</p>
                    <button class="login-btn" onclick="gaaTilForside()">Tilbage</button>
                </div>
            </div>
        </div>
    </div>

<script>
function skiftFane(fane) {
    document.getElementById("home-section").style.display = "none";
    document.getElementById("game-container").style.display = "flex";
    document.querySelectorAll(".game-view").forEach(v => v.style.display = "none");
    const titler = { 'quiz': '🎯 PENSUM TRÆNING', 'exam': '⏱️ EKSAMEN', 'dialog': '🗣️ ROLLESPIL', 'wiki': '📖 OPSLAG' };
    document.getElementById("active-title").innerText = titler[fane] || '';

    if (fane === 'quiz') { document.getElementById("quiz-section").style.display = "flex"; filterAndRestart(); }
    else if (fane === 'exam') { document.getElementById("exam-section").style.display = "flex"; }
    else if (fane === 'dialog') { document.getElementById("dialog-section").style.display = "flex"; startNyCase(); }
    else if (fane === 'wiki') { document.getElementById("wiki-section").style.display = "flex"; initOpslagsvaerk(); }
}
function gaaTilForside() { document.getElementById("game-container").style.display = "none"; document.getElementById("home-section").style.display = "flex"; }

// ==========================================
// 1. OPSLAGSVÆRK DATA & LOGIK (NY!)
// ==========================================
const opslagsData = [
    { emne: "Berigelsesforbuddet", kat: "FAL § 39", tekst: "Grundprincip: Man må ikke opnå en økonomisk vinding ved en skade. Erstatningen kan aldrig overstige det faktiske lidte tab, selvom summen er sat højere (Overforsikring)." },
    { emne: "Underforsikring", kat: "FAL § 40", tekst: "Hvis forsikringssummen er sat lavere end de faktiske værdier (fx indbo), nedsættes erstatningen forholdsmæssigt (pro-rata). Eks: Er man kun 50% forsikret, får man kun 50% af skaden dækket." },
    { emne: "Fremrykket accept", kat: "FAL § 11", tekst: "Særlig regel for forsikringer. Selvom en skriftlig police ikke er udstedt, indtræder selskabets ansvar, når kunden har accepteret et tilbud, og selskabet normalt ville have antaget risikoen." },
    { emne: "Mundtlige tilbud", kat: "AFTL § 3", tekst: "Aftaleloven bestemmer, at mundtlige tilbud skal accepteres straks, medmindre en anden frist aftales. Ellers falder de bort." },
    { emne: "Uren Accept", kat: "AFTL § 6", tekst: "Hvis en kunde returnerer et tilbud, men ændrer i betingelserne eller prisen, betragtes det juridisk som et afslag på det oprindelige tilbud samt et nyt modtilbud." },
    { emne: "Fuldmagt / Legitimation", kat: "AFTL § 10", tekst: "Bemyndigelse er hvad sælgeren internt må for sin chef. Legitimation er hvad kunden udefra med rimelighed forventer sælgeren må (fx give rabat). Handler sælger i strid med bemyndigelse, men inden for legitimation, er selskabet bundet over for en godtroende kunde." },
    { emne: "God Skik (IDD)", kat: "Etik", tekst: "Rådgiveren har pligt til at handle ærligt, redeligt og professionelt i kundens bedste interesse. Dette inkluderer pligt til objektiv behovsafdækning før et salg." },
    { emne: "Culpa-reglen", kat: "Erstatning", tekst: "Den almindelige erstatningsregel i Danmark. Man er kun erstatningsansvarlig for skader forvoldt ved uagtsomhed eller forsæt. Hændelige uheld udløser ikke ansvar." },
    { emne: "Samtalestruktur", kat: "Salg", tekst: "Den professionelle fase-opdeling: 1. Kontakt/Indledning, 2. Behovsafdækning (HV-spørgsmål), 3. Løsning/Præsentation, 4. Accept/Indvendinger, 5. Afslutning." },
    { emne: "Lønsomhed / Churn", kat: "Økonomi", tekst: "Churn er udtryk for kundeafgang. Krydssalg (flere produkter til samme kunde) øger loyaliteten drastisk, sænker churn og forbedrer dermed selskabets samlede lønsomhed." },
    { emne: "Dobbeltforsikring", kat: "FAL", tekst: "Er samme interesse forsikret mod samme fare i flere selskaber, hæfter selskaberne solidarisk. Men kunden kan pga. berigelsesforbuddet samlet set aldrig få mere end sit reelle tab." }
];

function initOpslagsvaerk() { visOpslagsvaerkResultater(opslagsData); }
function sogIOpslagsvaerk() {
    const term = document.getElementById("wiki-search").value.toLowerCase();
    const filtered = opslagsData.filter(o => o.emne.toLowerCase().includes(term) || o.tekst.toLowerCase().includes(term) || o.kat.toLowerCase().includes(term));
    visOpslagsvaerkResultater(filtered);
}
function visOpslagsvaerkResultater(data) {
    const container = document.getElementById("wiki-results");
    if(data.length === 0) { container.innerHTML = "<p style='color:var(--text-muted); font-size:13px;'>Ingen resultater fundet.</p>"; return; }
    container.innerHTML = data.map(item => `
        <div class="wiki-item">
            <div class="wiki-title">${item.emne} <span class="tag">${item.kat}</span></div>
            <div class="wiki-desc">${item.tekst}</div>
        </div>
    `).join("");
}

// ==========================================
// 2. KÆMPE OPGAVEPULJE (PENSUM KATEGORIER)
// ==========================================
const alleOpgaver = [
  /* TEGNING & AFTL */
  { id: "t_1", kategori: "Tegning", spørgsmål: "Kunden 'vil tænke over' et mundtligt tilbud. Senere på dagen ringer kunden og accepterer. Er aftalen bindende ifølge Aftaleloven?", options: ["Ja, tilbud gælder 24 timer.", "Nej, mundtlige tilbud falder bort, hvis de ikke accepteres straks (AFTL § 3).", "Ja, hvis samtalen er optaget.", "Ja, men selskabet kan annullere aftalen."], answer: 1, forklaring: "Jf. AFTL § 3 skal mundtlige tilbud accepteres straks uden aftalt frist. Ellers er kundens accept et nyt tilbud." },
  { id: "t_2", kategori: "Tegning", spørgsmål: "Frank modtager et skriftligt tilbud. Han retter prisen nedad, underskriver og returnerer. Hvad er konsekvensen?", options: ["Aftalen er bindende med den nye pris.", "Ændringen betragtes som et afslag og et nyt tilbud fra kunden (AFTL § 6).", "Aftalen er bindende med det oprindelige beløb."], answer: 1, forklaring: "AFTL § 6 fastslår, at 'uren accept' fungerer som afslag og modtilbud." },
  { id: "t_3", kategori: "Tegning", spørgsmål: "Kunden køber forsikring online til 'hurtigst mulig ikrafttræden'. Kunden får indbrud inden policen udstedes. Dækkes skaden?", options: ["Nej, policen skal være udstedt.", "Ja, pga. fremrykket accept (FAL § 11), da selskabet normalt ville have antaget risikoen.", "Kun hvis kunden har betalt første opkrævning."], answer: 1, forklaring: "For forsikringer gælder fremrykket accept (FAL § 11). Ansvaret indtræder ved accept-afsendelse." },
  { id: "t_4", kategori: "Tegning", spørgsmål: "Du giver 10% rabat, selvom du internt ikke har bemyndigelse til det. Er selskabet bundet af aftalen over for kunden?", options: ["Nej, man kan ikke binde selskabet ud over sin bemyndigelse.", "Ja, du har handlet inden for din 'legitimation', og kunden er i god tro (AFTL § 10).", "Nej, aftalen er ugyldig pga. svig."], answer: 1, forklaring: "Selvom sælger bryder sin bemyndigelse, bindes selskabet hvis løftet ligger inden for det, kunden forventer (legitimation)." },
  
  /* SKADESITUATIONEN & FAL */
  { id: "s_1", kategori: "Skadesituationen", spørgsmål: "Sanne har 1.000.000 kr. i indbosum, men kun reelle værdier for 750.000 kr. Hvad gælder ved en totalskade?", options: ["Hun får udbetalt 1.000.000 kr.", "Hun får maksimalt 750.000 kr. pga. berigelsesforbuddet.", "Aftalen er ugyldig pga. svig."], answer: 1, forklaring: "Overforsikring (FAL § 39). Berigelsesforbuddet sikrer, at man ikke må tjene på en skade." },
  { id: "s_2", kategori: "Skadesituationen", spørgsmål: "Peter har stjålet for 100.000 kr. Hans sum er 800.000 kr., men han har reelt indbo for 1.000.000 kr. Hvad får han udbetalt?", options: ["100.000 kr.", "80.000 kr. pga. pro-rata reglen (underforsikring).", "800.000 kr."], answer: 1, forklaring: "Underforsikring (FAL § 40). Forholdstallet (800k/1M) er 80%, så han får 80% af sit tab." },
  { id: "s_3", kategori: "Skadesituationen", spørgsmål: "En kunde får dækket en totalskade på sit hus. Hvordan gøres værdien typisk op?", options: ["Nyværdi (hvad det koster at bygge tilsvarende hus i dag).", "Dagsværdi (nyværdi fratrukket alder og slid).", "Handelsværdi (hvad huset kunne sælges for)."], answer: 0, forklaring: "Bygningsforsikringer dækker som udgangspunkt til nyværdi (genopførelsespris), forudsat huset var velvedligeholdt." },

let aktiveOpgaver = []; let currentIndex = 0; let correctCount = 0;
function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
function filterAndRestart() {
    const valg = document.getElementById("category-select").value;
    if (valg === "alle") aktiveOpgaver = shuffle([...alleOpgaver]);
    else if (valg === "fejl") {/* logik fjernet for brevity i stub */}
    else aktiveOpgaver = shuffle(alleOpgaver.filter(q => q.kategori === valg));
    currentIndex = 0; correctCount = 0; loadQuestion();
}

function loadQuestion() {
    if (!aktiveOpgaver.length) { document.getElementById("options-container").innerHTML = "<p>Ingen spørgsmål.</p>"; return; }
    const q = aktiveOpgaver[currentIndex];
    document.getElementById("category-tag").innerText = q.kategori; document.getElementById("question-text").innerText = q.spørgsmål;
    document.getElementById("explanation-box").style.display = "none"; document.getElementById("next-btn").style.display = "none";
    document.getElementById("progress-bar-fill").style.width = (currentIndex / aktiveOpgaver.length * 100) + "%";

    const container = document.getElementById("options-container"); container.innerHTML = "";
    q.options.forEach((opt, i) => {
        const btn = document.createElement("button"); btn.className = "btn"; btn.innerText = opt;
        btn.onclick = () => {
            if (i === q.answer) correctCount++;
            container.querySelectorAll(".btn").forEach((b, idx) => {
                b.disabled = true; if (idx === q.answer) b.classList.add("correct");
                if (idx === i && i !== q.answer) b.classList.add("wrong");
            });
            document.getElementById("explanation-text").innerText = q.forklaring;
            document.getElementById("explanation-box").style.display = "block"; document.getElementById("next-btn").style.display = "block";
        };
        container.appendChild(btn);
    });
    document.getElementById("score-board").innerText = `Spørgsmål ${currentIndex + 1} af ${aktiveOpgaver.length}`;
}
function nextQuestion() {
    currentIndex++;
    if (currentIndex < aktiveOpgaver.length) loadQuestion();
    else {
        document.getElementById("progress-bar-fill").style.width = "100%";
        document.getElementById("options-container").innerHTML = `<div style="text-align:center;"><h3>Afsluttet!</h3><p>Du fik ${correctCount} af ${aktiveOpgaver.length} rigtige.</p><button class="restart-btn" onclick="filterAndRestart()">Prøv Igen</button></div>`;
        document.getElementById("next-btn").style.display = "none";
    }
}

let nuvCaseId = "case3"; let nuvStepId = "start";
function startNyCase() {
    nuvCaseId = document.getElementById("case-select").value; nuvStepId = "start";
    document.getElementById("dialog-history").innerHTML = ""; document.getElementById("dialog-options").innerHTML = "";
    document.getElementById("dialog-feedback").innerText = ""; document.getElementById("dialog-next-btn").style.display = "none";
    document.getElementById("dialog-restart-btn").style.display = "none";
    renderDialogStep();
}
function renderDialogStep() {
    const s = cases[nuvCaseId].steps[nuvStepId];
    document.getElementById("dialog-history").innerHTML += `<div class="bubble bubble-sensor">${s.sensor}</div>`;
    const optCont = document.getElementById("dialog-options");
    if (s.options.length === 0) { document.getElementById("dialog-restart-btn").style.display = "block"; return; }
    s.options.forEach(o => {
        const b = document.createElement("button"); b.className = "btn"; b.innerText = o.text;
        b.onclick = () => {
            document.getElementById("dialog-history").innerHTML += `<div class="bubble bubble-user">${o.text}</div>`;
            const fb = document.getElementById("dialog-feedback"); fb.innerText = o.feedback; fb.style.color = o.rigtig ? "var(--success)" : "var(--danger)";
            optCont.innerHTML = ""; nuvStepId = o.next; document.getElementById("dialog-next-btn").style.display = "block";
            document.getElementById("dialog-history").scrollTop = document.getElementById("dialog-history").scrollHeight;
        };
        optCont.appendChild(b);
    });
}
function naesteDialogSkridt() { document.getElementById("dialog-next-btn").style.display = "none"; renderDialogStep(); }
