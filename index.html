<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IDD 3.58 - Salg og Rådgivning</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#131f24">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #131f24;
            --card-dark: #1f2f38;
            --border-dark: #2c424f;
            --text-main: #ffffff;
            --text-muted: #afbfc7;
            --success: #58cc02;
            --success-dark: #46a302;
            --danger: #ff4b4b;
            --danger-dark: #ea2b2b;
            --primary: #1cb0f6;
            --primary-dark: #1899d6;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        *, *:before, *:after { box-sizing: inherit; }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        
        .back-btn {
            background: #233642;
            border: 2px solid var(--border-dark);
            border-bottom-width: 4px;
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 13px;
        }
        .back-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .card { 
            background: var(--card-dark); 
            border-radius: 20px; 
            padding: 16px; 
            border: 2px solid var(--border-dark);
            border-bottom-width: 6px; 
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 10px;
        }

        .tag { 
            display: inline-block; 
            background: #253b47; 
            color: var(--primary); 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase;
            padding: 4px 10px; 
            border-radius: 20px; 
            margin-bottom: 8px; 
            align-self: flex-start;
        }

        .filter-box { 
            margin-bottom: 10px; 
            background: var(--card-dark); 
            padding: 10px; 
            border-radius: 16px; 
            border: 2px solid var(--border-dark);
            flex-shrink: 0;
        }

        select, input[type="text"] { 
            padding: 10px; 
            font-size: 14px; 
            border-radius: 12px; 
            border: 2px solid var(--border-dark); 
            width: 100%; 
            margin-top: 4px; 
            background: #111a21;
            color: var(--text-main);
            outline: none;
            font-weight: 700;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
        }

        .btn { 
            display: block; 
            width: 100%; 
            text-align: left; 
            padding: 12px 14px; 
            border: 2px solid var(--border-dark); 
            border-bottom-width: 4px; 
            border-radius: 14px; 
            background: #233642; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 700;
            color: var(--text-main);
            flex-shrink: 0;
            transition: all 0.1s;
        }
        .btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }

        .correct { 
            background-color: #1b4d2e !important; 
            border-color: var(--success) !important; 
            border-bottom-width: 4px !important;
            color: #d1fae5 !important; 
        }
        .wrong { 
            background-color: #4d1b1b !important; 
            border-color: var(--danger) !important; 
            border-bottom-width: 4px !important;
            color: #fee2e2 !important; 
        }

        .explanation { 
            margin-top: 8px; 
            padding: 10px; 
            background: #11261d; 
            border: 2px solid #1e4630;
            border-radius: 12px;
            font-size: 12px; 
            display: none; 
            color: #a7f3d0;
            max-height: 90px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .next-btn { 
            background: var(--success); 
            border-bottom: 4px solid var(--success-dark);
            color: white; 
            border-radius: 14px; 
            cursor: pointer; 
            padding: 12px; 
            display: none; 
            font-weight: 800; 
            font-size: 15px;
            width: 100%; 
            text-align: center;
            margin-top: 8px;
            flex-shrink: 0;
        }
        .next-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .score { 
            font-size: 12px; 
            font-weight: 800;
            color: var(--text-muted); 
            margin-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0;
        }

        .progress-bar-container {
            width: 100%;
            background: #2b414d;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .restart-btn { 
            background: var(--primary); 
            border-bottom: 4px solid var(--primary-dark);
            color: white; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 14px;
            padding: 12px; 
            width: 100%; 
            margin-top: 8px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            flex: 1;
        }
        
        .menu-btn {
            background: var(--card-dark);
            border: 2px solid var(--border-dark);
            border-bottom-width: 6px;
            color: var(--text-main);
            padding: 16px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.1s;
        }
        .menu-btn:active { transform: translateY(2px); border-bottom-width: 3px; }
        .menu-btn span { font-size: 24px; }

        /* Chat (Rollespil) Styles */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            margin-bottom: 10px;
        }
        .bubble {
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            max-width: 85%;
            word-wrap: break-word;
        }
        .bubble-sensor {
            background: #233642;
            border: 1px solid var(--border-dark);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #fff;
        }
        .bubble-user {
            background: var(--primary-dark);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        .dialog-feedback {
            font-size: 12px;
            color: var(--success);
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- FORSIDE / MENU -->
        <div id="home-section" style="display: flex; flex-direction: column; height: 100%;">
            <div class="card" style="justify-content: space-between; text-align: center; padding: 24px;">
                <div>
                    <span style="font-size: 36px;">🛡️</span>
                    <h2 style="margin: 10px 0 5px 0; font-size: 22px;">IDD 3.58 Rådgivning</h2>
                    <p style="color: var(--text-muted); font-size: 13px; margin: 0;">Træn lovgivning og kundedialog</p>
                </div>

                <div class="menu-grid">
                    <button class="menu-btn" onclick="skiftFane('quiz')" style="border-color: #58cc02; background: #1b4d2e;">
                        <span>🎯</span> <div><div>Opgavetræning</div><div style="font-size: 11px; color: #a7f3d0; font-weight: normal;">FAL, Aftaleloven, etc.</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('exam')" style="border-color: #1cb0f6; background: #153342;">
                        <span>⏱️</span> <div><div>Eksamenstest</div><div style="font-size: 11px; color: #bae6fd; font-weight: normal;">Simuleret prøve</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('dialog')" style="border-color: #ce82ff; background: #3b1f4d;">
                        <span>🗣️</span> <div><div>Rollespil (Mundtlig)</div><div style="font-size: 11px; color: #e9d5ff; font-weight: normal;">Træn kundesamtaler & jura</div></div>
                    </button>
                    <button class="menu-btn" onclick="skiftFane('wiki')" style="border-color: #ff9600; background: #452b11;">
                        <span>📖</span> <div><div>Opslagsværk</div><div style="font-size: 11px; color: #fde68a; font-weight: normal;">Søg i begreber</div></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- SPIL CONTAINER -->
        <div id="game-container" style="display: none; flex-direction: column; height: 100%;">
            <div class="top-bar">
                <button class="back-btn" onclick="gaaTilForside()">🏠 Tilbage</button>
                <span id="active-title" style="font-weight: 800; font-size: 14px; color: var(--text-muted);">...</span>
            </div>

            <!-- SEKTION 1: TRÆNING -->
            <div id="quiz-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="filter-box">
                    <label for="category-select" style="font-weight: 800; font-size: 12px; color: var(--text-muted);">VÆLG EMNE:</label>
                    <select id="category-select" onchange="filterAndRestart()">
                        <option value="alle">Alle emner</option>
                        <option value="fejl" id="fejl-option">❌ Mine fejl (0)</option>
                        <option value="FAL">Forsikringsaftaleloven (FAL)</option>
                        <option value="AFTL">Aftaleloven (AFTL)</option>
                    </select>
                </div>

                <div class="card">
                    <div class="score">
                        <span id="score-board">Spørgsmål 1</span>
                        <span id="live-score">Rigtige: 0 / 0</span>
                    </div>
                    
                    <div class="progress-bar-container">
                        <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    </div>

                    <span id="category-tag" class="tag">Kategori</span>
                    <h3 id="question-text" style="margin: 0 0 8px 0; font-size: 15px; line-height: 1.3;">Henter spørgsmål...</h3>
                    
                    <div id="options-container" class="options-container"></div>

                    <div id="explanation-box" class="explanation">
                        <strong>💡 Rådgivningsfokus:</strong>
                        <p id="explanation-text" style="margin:2px 0 0 0;"></p>
                    </div>

                    <button id="next-btn" class="next-btn" onclick="nextQuestion()">Fortsæt →</button>
                </div>
            </div>

            <!-- SEKTION 2: EKSAMEN -->
            <div id="exam-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="card" id="exam-start-card" style="justify-content: center; text-align: center;">
                    <h3 style="font-size: 18px; margin-top:0;">🎓 3.58 Eksamen</h3>
                    <p style="font-size: 13px; color: var(--text-muted); line-height: 1.4;">
                        10 spørgsmål i Aftaleloven og FAL. Tidsgrænse: 20 minutter.
                    </p>
                    <button class="login-btn" style="padding: 12px; margin-top: 15px;" onclick="startEksamen()">Start 🚀</button>
                </div>

                <div class="card" id="exam-quiz-card" style="display: none;">
                    <div class="score">
                        <span id="exam-progress">Spørgsmål 1</span>
                        <span id="exam-timer" class="timer-badge" style="background:var(--danger);">⏱️ 20:00</span>
                    </div>
                    <span id="exam-category-tag" class="tag">Kategori</span>
                    <h3 id="exam-question-text" style="margin: 0 0 8px 0; font-size: 15px;">Henter...</h3>
                    
                    <div id="exam-options-container" class="options-container"></div>

                    <button id="exam-next-btn" class="next-btn" style="display: block;" onclick="naesteEksamensSporgsmal()">Gem & Næste →</button>
                </div>
            </div>

            <!-- SEKTION 3: SAMTALE / ROLLESPIL -->
            <div id="dialog-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="filter-box">
                    <label style="font-weight: 800; font-size: 12px; color: var(--text-muted);">VÆLG CASE:</label>
                    <select id="case-select" onchange="startNyCase()">
                        <option value="case1">Kunde: Henrik (Mundtligt tilbud)</option>
                        <option value="case2">Kunde: Sanne (Overforsikring)</option>
                    </select>
                </div>

                <div class="card" style="flex: 1; padding: 10px; display: flex; flex-direction: column;">
                    
                    <div id="dialog-history" class="chat-container">
                        <!-- Chat bobler dukker op her -->
                    </div>
                    
                    <div id="dialog-feedback" class="dialog-feedback"></div>

                    <div id="dialog-options" class="options-container" style="flex: none; margin-top:0;">
                        <!-- Valgmuligheder dukker op her -->
                    </div>
                    <button id="dialog-next-btn" class="next-btn" style="display: none;" onclick="naesteDialogSkridt()">Fortsæt Samtalen →</button>
                    <button id="dialog-restart-btn" class="restart-btn" style="display: none;" onclick="startNyCase()">Prøv Case Igen 🔄</button>
                </div>
            </div>

            <!-- SEKTION 4: OPSLAGSVÆRK -->
            <div id="wiki-section" class="game-view" style="display: none; flex-direction: column; height: 100%;">
                <div class="card">
                    <h3 style="font-size: 16px; margin-top:0;">📖 Opslagsværk</h3>
                    <input type="text" id="wiki-search" placeholder="🔍 Søg på f.eks. FAL § 39, AFTL..." onkeyup="sogIOpslagsvaerk()">
                    <div class="options-container" id="wiki-results" style="margin-top: 8px;"></div>
                </div>
            </div>
        </div>
    </div>

<script>
function skiftFane(fane) {
    document.getElementById("home-section").style.display = "none";
    document.getElementById("game-container").style.display = "flex";
    
    document.querySelectorAll(".game-view").forEach(v => v.style.display = "none");

    const titler = { 'quiz': '🎯 OPGAVETRÆNING', 'exam': '⏱️ EKSAMEN', 'dialog': '🗣️ ROLLESPIL', 'wiki': '📖 OPSLAG' };
    document.getElementById("active-title").innerText = titler[fane] || '';

    if (fane === 'quiz') {
        document.getElementById("quiz-section").style.display = "flex";
        filterAndRestart();
    } else if (fane === 'exam') {
        document.getElementById("exam-section").style.display = "flex";
        document.getElementById("exam-start-card").style.display = "flex";
        document.getElementById("exam-quiz-card").style.display = "none";
    } else if (fane === 'dialog') {
        document.getElementById("dialog-section").style.display = "flex";
        startNyCase();
    } else if (fane === 'wiki') {
        document.getElementById("wiki-section").style.display = "flex";
        visOpslagsvaerk();
    }
}

function gaaTilForside() {
    nulstilEksamensTimer();
    document.getElementById("game-container").style.display = "none";
    document.getElementById("home-section").style.display = "flex";
}

// -------------------------------------------------------------
// OPGAVEDATA (Baseret direkte på dine officielle filer)
// -------------------------------------------------------------
const alleOpgaver = [
  // Fra Fil 1: Over/Underforsikring (FAL)
  {
    id: "f1_1", kategori: "FAL",
    spørgsmål: "Sanne har tegnet en indboforsikring på 1.000.000 kr., men har reelt kun værdier for 750.000 kr. Hvilken betydning har dette for hendes erstatning?",
    options: [
      "Hun får udbetalt 1.000.000 kr. ved totalskade, fordi hun har betalt for summen.",
      "Hun får maksimalt 750.000 kr., da erstatningen ikke må overstige det reelle tab (Berigelsesforbuddet).",
      "Selskabet nedsætter erstatningen med 25% pga. forkerte oplysninger.",
      "Aftalen er ugyldig, da summen er sat bevidst for højt."
    ],
    answer: 1,
    forklaring: "Sanne er overforsikret (FAL § 39). Berigelsesforbuddet sikrer, at kunden ikke må opnå en vinding ved en skade, og derfor erstattes kun de faktiske 750.000 kr."
  },
  {
    id: "f1_2", kategori: "FAL",
    spørgsmål: "Peter har indbrud og får stjålet for 100.000 kr. Hans forsikringssum er 800.000 kr., men hans faktiske samlede værdier er 1.000.000 kr. Hvad får han i erstatning?",
    options: [
      "100.000 kr., da tabet er lavere end summen.",
      "80.000 kr., da han er underforsikret, og skaden udbetales forholdsmæssigt.",
      "Ingenting, da han har opgivet forkerte værdier ved aftalens indgåelse.",
      "800.000 kr., da summen udgør maksgrænsen."
    ],
    answer: 1,
    forklaring: "Peter er underforsikret (FAL § 40). Forholdstallet mellem sum (800k) og værdi (1M) er 80%. Tabet på 100.000 kr. dækkes derfor med 80% = 80.000 kr."
  },
  {
    id: "f1_3", kategori: "FAL",
    spørgsmål: "Bettinas redskaber brænder for 10.000 kr. Hendes sum er 730.000 kr., men værdierne er reelt 550.000 kr. Hvad får hun udbetalt?",
    options: [
      "10.000 kr., da hendes tab kan dækkes fuldt ud af forsikringssummen og de faktiske værdier.",
      "Ingenting, da hun er overforsikret og dermed har misligholdt aftalen.",
      "13.272 kr., på grund af pro-rata princippet.",
      "730.000 kr., da det er den sum hun har købt."
    ],
    answer: 0,
    forklaring: "Bettina er overforsikret, men det påvirker ikke delskader, så længe de er under både sum og reel værdi (FAL § 39). Hun får dækket sit fulde tab på 10.000 kr."
  },
  {
    id: "f1_4", kategori: "FAL",
    spørgsmål: "Gurli har en sum på 700.000 kr. og værdier for 600.000 kr. Hun får stjålet smykker for 50.000 kr. og sølvtøj for 30.000 kr. Hvor meget får hun i erstatning?",
    options: [
      "600.000 kr.",
      "50.000 kr.",
      "80.000 kr., da tabet er under både forsikringssum og totalværdi.",
      "Ingenting pga. overforsikring."
    ],
    answer: 2,
    forklaring: "Gurli er overforsikret (FAL § 39), og får udbetalt sit reelle tab på i alt 80.000 kr., forudsat der ikke er specifikke interne beløbsgrænser for særligt indbo."
  },

  // Fra Fil 2: Aftaleloven
  {
    id: "f2_1", kategori: "AFTL",
    spørgsmål: "Du giver et mundtligt tilbud på 1.500 kr., som kunden 'vil tænke over'. Senere på dagen ringer kunden og accepterer, men prisen skulle have været 1.800 kr. Er aftalen til 1.500 kr. bindende?",
    options: [
      "Ja, mundtlige tilbud gælder 24 timer.",
      "Ja, tilbud og accept matcher hinanden.",
      "Nej, et mundtligt tilbud falder bort, hvis det ikke accepteres straks (AFTL § 3).",
      "Ja, men selskabet kan annullere aftalen inden for 14 dage."
    ],
    answer: 2,
    forklaring: "Jf. AFTL § 3, stk. 2 skal mundtlige tilbud accepteres straks uden aftalt frist. Kundens henvendelse senere på dagen anses som et nyt tilbud (AFTL § 1)."
  },
  {
    id: "f2_2", kategori: "AFTL",
    spørgsmål: "Frank modtager et skriftligt tilbud på 32.000 kr. i erstatning. Han retter beløbet til 35.000 kr., underskriver og returnerer. Skal selskabet betale 35.000 kr.?",
    options: [
      "Ja, han har returneret dokumentet med en gyldig underskrift.",
      "Nej, da han har ændret i tilbuddet, betragtes det som et afslag og et nyt tilbud (AFTL § 6).",
      "Ja, fordi selskabet oprindeligt sendte ham tilbuddet.",
      "Nej, han har dermed mistet retten til erstatning helt."
    ],
    answer: 1,
    forklaring: "AFTL § 6 fastslår, at en 'uren accept' (med ændringer) fungerer som et afslag på det oprindelige tilbud i forening med et helt nyt tilbud fra kunden, som selskabet nu frit kan afvise."
  },
  {
    id: "f2_3", kategori: "AFTL",
    spørgsmål: "Kathe får på en messe i weekenden en flyer med en acceptfrist, der kun gælder weekenden ud. Hun mailer sin accept mandag. Er der en bindende aftale?",
    options: [
      "Nej, når acceptfristen er overskredet, betragtes hendes svar som et nyt tilbud (AFTL § 2 & 4).",
      "Ja, fordi hun gjorde det hurtigst muligt efter helgen.",
      "Ja, for skriftlige tilbud gælder altid 8 dage ifølge loven.",
      "Nej, fordi flyers aldrig kan betragtes som juridiske tilbud."
    ],
    answer: 0,
    forklaring: "Når fristen for accept overskrides, forfalder det oprindelige tilbud. Kathes mail mandag er derfor et helt nyt tilbud (AFTL § 4), som selskabet frit kan afvise."
  },
  {
    id: "f2_4", kategori: "AFTL",
    spørgsmål: "Du giver en kunde 10% rabat i telefonen, selvom chefen har sagt, du ikke må (overskridelse af bemyndigelse). Er selskabet bundet af rabatten?",
    options: [
      "Nej, en medarbejder kan aldrig binde selskabet ud over sin bemyndigelse.",
      "Nej, kunden skal selv kende til selskabets interne rabatregler.",
      "Ja, du har handlet inden for din legitimation, og kunden var i god tro (AFTL § 10 & 11).",
      "Ja, men selskabet kan frit opkræve beløbet næste måned."
    ],
    answer: 2,
    forklaring: "Selvom sælger handlede uden for bemyndigelse, var det inden for dennes 'legitimation' (hvad kunden rimeligvis kan forvente af en sælger). Aftalen binder frem til næste hovedforfald."
  },
  {
    id: "f2_5", kategori: "FAL",
    spørgsmål: "Gurli køber indboforsikring på nettet 'til hurtigst mulig ikrafttræden'. Selskabet har ikke behandlet sagen endnu, da hun får indbrud en uge efter. Er hun dækket?",

// OPGAVE-LOGIK (TRÆNING)
// -------------------------------------------------------------
let aktiveOpgaver = [];
let currentIndex = 0;
let correctCount = 0;

function hentGemteFejl() { return JSON.parse(localStorage.getItem("idd_fejl") || "[]"); }
function gemFejlID(id) {
    let list = hentGemteFejl();
    if (!list.includes(id)) { list.push(id); localStorage.setItem("idd_fejl", JSON.stringify(list)); }
    opdaterFejl();
}
function fjernFejlID(id) {
    let list = hentGemteFejl().filter(x => x !== id);
    localStorage.setItem("idd_fejl", JSON.stringify(list));
    opdaterFejl();
}
function opdaterFejl() {
    const opt = document.getElementById("fejl-option");
    if (opt) opt.innerText = `❌ Mine fejl (${hentGemteFejl().length})`;
}

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

function filterAndRestart() {
    const valg = document.getElementById("category-select").value;
    if (valg === "alle") aktiveOpgaver = shuffle([...alleOpgaver]);
    else if (valg === "fejl") {
        const errs = hentGemteFejl();
        aktiveOpgaver = shuffle(alleOpgaver.filter(q => errs.includes(q.id)));
        if(aktiveOpgaver.length === 0) { alert("Ingen fejl gemt! Godt gået 🎉"); document.getElementById("category-select").value = "alle"; filterAndRestart(); return; }
    } 
    else aktiveOpgaver = shuffle(alleOpgaver.filter(q => q.kategori === valg));
    
    currentIndex = 0; correctCount = 0;
    loadQuestion();
}

function loadQuestion() {
    if (!aktiveOpgaver.length) return;
    const q = aktiveOpgaver[currentIndex];
    document.getElementById("category-tag").innerText = q.kategori;
    document.getElementById("question-text").innerText = q.spørgsmål;
    document.getElementById("explanation-box").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("progress-bar-fill").style.width = (currentIndex / aktiveOpgaver.length * 100) + "%";

    const container = document.getElementById("options-container");
    container.innerHTML = "";
    q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i, btn);
        container.appendChild(btn);
    });
    document.getElementById("score-board").innerText = `Spørgsmål ${currentIndex + 1} af ${aktiveOpgaver.length}`;
    document.getElementById("live-score").innerText = `Rigtige: ${correctCount}`;
}

function checkAnswer(selIdx, btnClicked) {
    const q = aktiveOpgaver[currentIndex];
    const btns = document.querySelectorAll("#options-container .btn");
    
    if (selIdx === q.answer) { correctCount++; fjernFejlID(q.id); } 
    else { gemFejlID(q.id); }

    btns.forEach((b, i) => {
        b.disabled = true;
        if (i === q.answer) b.classList.add("correct");
        if (i === selIdx && selIdx !== q.answer) b.classList.add("wrong");
    });

    document.getElementById("explanation-text").innerText = q.forklaring;
    document.getElementById("explanation-box").style.display = "block";
    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < aktiveOpgaver.length) loadQuestion();
    else {
        document.getElementById("progress-bar-fill").style.width = "100%";
        document.getElementById("options-container").innerHTML = `
            <div style="text-align:center; padding:10px;">
                <h3 style="margin-top:0;">Træning afsluttet!</h3>
                <p>Du fik ${correctCount} af ${aktiveOpgaver.length} rigtige.</p>
                <button class="restart-btn" onclick="filterAndRestart()">Prøv Igen 🔄</button>
            </div>
        `;
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }
}

let nuvCaseId = "case1";
let nuvStepId = "start";

function startNyCase() {
    nuvCaseId = document.getElementById("case-select").value;
    nuvStepId = "start";
    document.getElementById("dialog-history").innerHTML = "";
    document.getElementById("dialog-next-btn").style.display = "none";
    document.getElementById("dialog-restart-btn").style.display = "none";
    renderDialogStep();
}

function renderDialogStep() {
    const stepData = cases[nuvCaseId].steps[nuvStepId];
    
    // Vis Sensor bubble
    const hist = document.getElementById("dialog-history");
    hist.innerHTML += `<div class="bubble bubble-sensor">${stepData.sensor}</div>`;
    hist.scrollTop = hist.scrollHeight;

    const optCont = document.getElementById("dialog-options");
    optCont.innerHTML = "";
    document.getElementById("dialog-feedback").innerText = "";

    if (stepData.options.length === 0) {
        document.getElementById("dialog-restart-btn").style.display = "block";
        return;
    }

    stepData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = opt.text;
        btn.onclick = () => handleDialogChoice(opt);
        optCont.appendChild(btn);
    });
}

function handleDialogChoice(valgtOption) {
    const hist = document.getElementById("dialog-history");
    hist.innerHTML += `<div class="bubble bubble-user">${valgtOption.text}</div>`;
    
    const feedbackEl = document.getElementById("dialog-feedback");
    feedbackEl.innerText = valgtOption.feedback;
    feedbackEl.style.color = valgtOption.rigtig ? "var(--success)" : "var(--danger)";

    document.getElementById("dialog-options").innerHTML = "";
    
    nuvStepId = valgtOption.next;
    
    document.getElementById("dialog-next-btn").style.display = "block";
    hist.scrollTop = hist.scrollHeight;
}

function naesteDialogSkridt() {
    document.getElementById("dialog-next-btn").style.display = "none";
    renderDialogStep();
}
